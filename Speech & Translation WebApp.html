        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        h1 {
            color: #333;
        }
        .container {
            margin-top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 18px;
            width: 60%;
            margin: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            padding: 15px 30px;
            font-size: 22px;
            background-color: #ffad99; /* Peach color */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #ff8c73; /* Darker peach on hover */
        }
        .translations {
            margin-top: 30px;
            color: white; /* Make all text white */
        }
        .translations p {
            font-size: 20px;
            margin: 10px;
        }
        .language-selector {
            margin-top: 20px;
            color: white; /* Change text color to white */
        }
        select {
            font-size: 18px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .background {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background-size: cover;
            background-position: center;
        }
    </style>

        // Function to speak the text entered in the input box
        function speakText() {
            const text = document.getElementById("textInput").value.trim().toLowerCase();
            const speech = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(speech);

            // Check for translations (case insensitive)
            if (translations[text]) {
                document.getElementById("englishText").innerText = text;
                document.getElementById("urduText").innerText = translations[text]["urdu"];
                document.getElementById("arabicText").innerText = translations[text]["arabic"];
                document.getElementById("chineseText").innerText = translations[text]["chinese"];
                document.getElementById("pashtoText").innerText = translations[text]["pashto"];
            } else {
                document.getElementById("englishText").innerText = text;
                document.getElementById("urduText").innerText = "Translation not available";
                document.getElementById("arabicText").innerText = "Translation not available";
                document.getElementById("chineseText").innerText = "Translation not available";
                document.getElementById("pashtoText").innerText = "Translation not available";
            }
        }

        // Function to change background image based on selected language
        function changeBackground() {
            const selectedLanguage = document.getElementById("languageSelect").value;
            const backgroundElement = document.getElementById("background");

            switch (selectedLanguage) {
                case "urdu":
                    backgroundElement.style.backgroundImage = "url('file:///C:/Users/Desktop/Desktop/Project/urdu.jpg')";

                case "pashto":

                    break;
                default:

            }
